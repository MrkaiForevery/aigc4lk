server:
  port: 10010
spring:
  application:
    name: aigc4lk-commander-agent
  config:
    import:
      - nacos:graph-templates.yaml?refreshEnabled=true&group=COMMANDER_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:intent-rules.yaml?refreshEnabled=true&group=COMMANDER_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:comander-resilience4j.yaml?refreshEnabled=true&group=COMMANDER_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:common-chat-model-api-keys.properties?refreshEnabled=true&group=DEFAULT_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:commander-chroma-vectorstore-config.yaml?refreshEnabled=true&group=COMMANDER_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:spring-ai-mcp-config.yaml?refreshEnabled=true&group=COMMANDER_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:staic-application-metrics.yaml?refreshEnabled=false&group=DEFAULT_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
  cloud:
    nacos:
      # Nacos 服务发现配置
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: 0f18537a-2027-45f8-9a55-e837fa9fdd2a
        username: aigc4lk
        password: 123456
      # Nacos 配置中心配置
      config:
        server-addr: 127.0.0.1:8848
        namespace: 0f18537a-2027-45f8-9a55-e837fa9fdd2a
        group: COMMANDER_GROUP
        username: aigc4lk
        password: 123456
        cluster-name: aigc4lk-commander-agent-cluster
  ai:
    # 这里设置占位的原因:DashScopeChatAutoConfiguration 在启动时，会尝试从 application.yml
    # 或 application.properties 等标准配置源中读取 spring.ai.dashscope.api-key 属性。
    # 即使你从 Nacos 导入了所有配置，这个自动配置类也依然会尝试从本地查找，如果找不到，就会启动失败。
    # 所以这里先会用一个default_key来让其正常启动，后面nacos配置读取完了以后，自然会覆盖，一个典型的配置加载顺序问题
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:default_key}
    openai:
      api-key: ${DASHSCOPE_API_KEY:default_key}
    alibaba:
      a2a:
        nacos:
          # Spring AI Alibaba A2A 配置
          server-addr: 127.0.0.1:8848
          namespace: 0f18537a-2027-45f8-9a55-e837fa9fdd2a
          username: aigc4lk
          password: 123456
          registry:
            enabled: false
          discovery:
            enabled: true
    model:
      embedding: dashscope

seata:
  # 注册中心和配置中心均使用 file 模式（与你的 Server 端保持一致）
  registry:
    type: file
  config:
    type: file
  # 客户端的事务分组（必须与 vgroupMapping 的 key 一致）
  tx-service-group: agent-tx-group
  service:
    # 事务分组映射：将 agent-tx-group 映射到 default 服务组
    vgroup-mapping:
      agent-tx-group: default
    # 服务组 default 对应的 Seata Server 地址列表（多个用逗号分隔）
    grouplist:
      default: 127.0.0.1:8091   # Seata Server 的地址，端口默认 8091

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      agent-data-analysis-agent:
        base-config: default
      agent-document-agent:
        base-config: default
      chroma-case:
        failure-rate-threshold: 30
      llm-fast-model:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
      llm-reasoning-model:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      seata-tc:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
  ratelimiter:
    instances:
      llm-api:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 5s
  bulkhead:
    instances:
      parallel-execution:
        max-concurrent-calls: 10
        max-wait-duration: 5s
  timelimiter:
    instances:
      a2a-call:
        timeout-duration: 30s
      llm-call:
        timeout-duration: 10s

logging:
  level:
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.naming.failover: OFF
    com.alibaba.nacos.client: DEBUG
    com.alibaba.cloud.nacos.configdata: DEBUG
    org.springframework.boot.context.config: DEBUG
    com.air.platform.common.a2a.router.NacosA2ARouter: DEBUG
    com.air.commander.graph.DynamicGraphBuilder: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs           # OpenAPI JSON 文档路径
  swagger-ui:
    path: /swagger-ui.html       # Swagger UI 页面路径
  info:
    title: Commander API
    description: 企业级智能编排平台 - Commander 服务接口
    version: 1.0.0

redisson:
  singleServerConfig:
    address: "redis://localhost:6379"
    # password: 你的密码（如果没有则删除该行）
    # database: 0
    connectionMinimumIdleSize: 5
    connectionPoolSize: 10