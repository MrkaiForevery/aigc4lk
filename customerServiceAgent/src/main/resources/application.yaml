server:
  port: 12400

spring:
  application:
    name: aigc4lk-customer-service-agent
  config:
    import:
      - nacos:common-chat-model-api-keys.properties?refreshEnabled=true&group=DEFAULT_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:customer-service-agent-remote-mcp.yaml?refreshEnabled=true&group=CUSTOMER_SERVICE_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
  cloud:
    nacos:
      # Nacos 服务发现配置
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: 0f18537a-2027-45f8-9a55-e837fa9fdd2a
        username: aigc4lk
        password: 123456
      # Nacos 配置中心配置
      config:
        server-addr: 127.0.0.1:8848
        namespace: 0f18537a-2027-45f8-9a55-e837fa9fdd2a
        group: CUSTOMER_SERVICE_GROUP
        username: aigc4lk
        password: 123456
        cluster-name: aigc4lk-customer-service-agent-service-cluster
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
    alibaba:
      a2a:
        nacos:
          server-addr: 127.0.0.1:8848
          namespace: 0f18537a-2027-45f8-9a55-e837fa9fdd2a
          username: aigc4lk
          password: 123456
          registry:
            enabled: true
          discovery:
            enabled: true
        server:
          version: 0.0.1
          card:
            name: customer-service-agent
            description: 智能客服智能体，支持售后/技术/投诉路由，以及工单查询、订单查询
            skills:
              - id: route_inquiry
                name: 问题分类与路由
                description: 识别用户问题类型（售后/技术/投诉/其他），并路由到对应处理流程
                tags:
                  - routing
                  - classification

              - id: query_order
                name: 订单查询
                description: 根据订单号查询订单状态、物流信息
                tags:
                  - order

              - id: query_ticket
                name: 工单查询
                description: 查询用户历史工单及处理进度
                tags:
                  - ticket

            provider:
              name: lk
              organization: "air.com"
              url: "https://www.air.com"
    mcp:
      client:
        enabled: false  # 禁用 MCP 客户端自动配置 todo 临时禁止
        request-timeout: 30s

# Feign 配置（调用 Memory Service）
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
  circuitbreaker:
    enabled: true

logging:
  level:
    com.alibaba.cloud.ai.graph: DEBUG
    com.alibaba.cloud.ai.agent: DEBUG
    com.alibaba.cloud.ai.a2a: DEBUG
    org.springframework.ai: DEBUG
    com.air.document: DEBUG

