server:
  port: 12100

spring:
  application:
    name: aigc4lk-document-agent
  config:
    import:
      - nacos:common-chat-model-api-keys.properties?refreshEnabled=true&group=DEFAULT_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:document-mcp-config.yaml?refreshEnabled=true&group=DOCUMENT_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
  cloud:
#    loadbalancer:
#      ribbon:
#        enabled: false
    nacos:
      # Nacos 服务发现配置
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: 0f18537a-2027-45f8-9a55-e837fa9fdd2a
        username: aigc4lk
        password: 123456
      # Nacos 配置中心配置
      config:
        server-addr: 127.0.0.1:8848
        namespace: 0f18537a-2027-45f8-9a55-e837fa9fdd2a
        group: DOCUMENT_GROUP
        username: aigc4lk
        password: 123456
        cluster-name: aigc4lk-document-agent-service-cluster
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
    alibaba:
      a2a:
        nacos:
          server-addr: 127.0.0.1:8848
          namespace: 0f18537a-2027-45f8-9a55-e837fa9fdd2a
          username: aigc4lk
          password: 123456
          registry:
            enabled: true          # 注册到 Nacos A2A
          discovery:
            enabled: true
        server:
          version: 0.0.1
          card:
            name: document-agent    # 必须和 @Bean name 一致
            description: 文档生成智能体
            skills:
              - id: document_generation
                name: 文档生成
                description: 根据用户需求生成高质量的结构化文档，支持技术报告、分析报告、会议纪要等多种类型
                tags:
                  - document
                  - generation
                  - writing
                examples:
                  - 生成一份关于 Spring AI 的技术报告
                  - 写一篇市场分析报告

              - id: profile_awareness
                name: 用户画像感知
                description: 根据用户画像（技术等级、沟通风格、偏好设置）自动调整文档风格和深度
                tags:
                  - profile
                  - personalization
                  - adaptation

              - id: knowledge_retrieval
                name: 知识库检索
                description: 从共享知识库中通过向量语义搜索检索相关历史知识和参考文档，辅助文档生成
                tags:
                  - knowledge
                  - search
                  - rag

              - id: multi_turn_collaboration
                name: 多轮协作
                description: 支持多轮对话，根据用户反馈迭代优化文档内容，包括修改、扩展、缩减和重写
                tags:
                  - collaboration
                  - multi-turn
                  - iteration

              - id: cross_agent_collaboration
                name: 跨Agent协作
                description: 可调用其他子Agent（如数据分析Agent）获取辅助数据，通过A2A协议通信
                tags:
                  - a2a
                  - multi-agent
                  - delegation

              - id: output_formatting
                name: 输出格式化
                description: 支持输出多种格式的文档，包括 Markdown、纯文本、结构化 JSON
                tags:
                  - formatting
                  - output

            provider:
              name: lk
              organization: "air.com"
              url: "https://www.air.com"
    mcp:
      client:
        enabled: false  # 禁用 MCP 客户端自动配置 todo 临时禁止

logging:
  level:
    com.alibaba.cloud.ai.graph: DEBUG
    com.alibaba.cloud.ai.agent: DEBUG
    com.alibaba.cloud.ai.a2a: DEBUG
    org.springframework.ai: DEBUG
    com.air.document: DEBUG