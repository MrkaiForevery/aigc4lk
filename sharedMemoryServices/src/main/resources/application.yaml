server:
  port: 10086
spring:
  application:
    name: aigc4lk-shared-memory-service
  # postgres 数据库连接
  datasource:
    url: jdbc:postgresql://localhost:5432/aigc4lk_db
    username: aigc4lk
    password: 123456
    driver-class-name: org.postgresql.Driver
  config:
    import:
      - nacos:common-chat-model-api-keys.properties?refreshEnabled=true&group=DEFAULT_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:common--desensitize-enable.yaml?refreshEnabled=true&group=DEFAULT_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:memory-general-enable.yaml?refreshEnabled=true&group=MEMORY_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:memory-chroma-vectorstore-config.yaml?refreshEnabled=true&group=MEMORY_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
      - nacos:staic-application-metrics.yaml?refreshEnabled=false&group=DEFAULT_GROUP&namespace=0f18537a-2027-45f8-9a55-e837fa9fdd2a&username=aigc4lk&password=123456
  cloud:
    nacos:
      # Nacos 服务发现配置
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: 0f18537a-2027-45f8-9a55-e837fa9fdd2a
        username: aigc4lk
        password: 123456
      # Nacos 配置中心配置
      config:
        server-addr: 127.0.0.1:8848
        namespace: 0f18537a-2027-45f8-9a55-e837fa9fdd2a
        group: MEMORY_GROUP
        username: aigc4lk
        password: 123456
        cluster-name: aigc4lk-shared-memory-service-cluster
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:default_key}
    openai:
      api-key: ${DASHSCOPE_API_KEY:default_key}
      embedding:
        options:
          model: text-embedding-ada-002
    model:
      embedding: openai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

redisson:
  single-server-config:
    address: "redis://localhost:6379"